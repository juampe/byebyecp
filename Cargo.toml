[workspace]
resolver = "2"
members = [
    "crates/bbcp-core",
    "crates/bbcp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
authors = ["juampe and Bye Bye Cloud Photos contributors"]
repository = "https://github.com/juampe/byebyecp"
homepage = "https://github.com/juampe/byebyecp"
description = "Safe, reversible consolidation of cloud photo libraries"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
image = "0.25"
kamadak-exif = "0.6"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
